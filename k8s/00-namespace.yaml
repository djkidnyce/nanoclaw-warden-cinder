apiVersion: v1
kind: Namespace
metadata:
  name: nanoclaw
  labels:
    # Enforce the strictest Pod Security Standard. Pods that violate it are rejected,
    # not just flagged. This is the OS-level isolation backbone.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
