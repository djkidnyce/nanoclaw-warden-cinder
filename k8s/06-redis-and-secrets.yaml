# =============================================================================
# Redis: the inbound queue and the scale-to-zero signal source.
# Single instance shown for clarity. For production use a managed Redis or a
# replicated StatefulSet. Redis here is a coordination bus, not agent memory —
# sub-agents are stateless by design.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nanoclaw-redis
  namespace: nanoclaw
automountServiceAccountToken: false
# No Role/RoleBinding. Redis never needs the Kubernetes API.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: nanoclaw
  labels:
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nanoclaw
        app.kubernetes.io/component: redis
    spec:
      serviceAccountName: nanoclaw-redis
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 6379
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: nanoclaw
spec:
  selector:
    app.kubernetes.io/component: redis
  ports:
    - port: 6379
      targetPort: 6379
---
# Allow controller + vault to reach Redis (the default-deny policy blocks it otherwise).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-access
  namespace: nanoclaw
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: controller
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: sub-agent
      ports:
        - protocol: TCP
          port: 6379
---
# =============================================================================
# Credentials. Create this with `kubectl create secret` or an external secrets
# operator (recommended: External Secrets Operator pulling from AWS Secrets
# Manager / Vault). DO NOT commit real values. This stub documents the keys.
# Only the Vault sidecar references it. The controller has no RBAC to read it.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: nanoclaw-credentials
  namespace: nanoclaw
type: Opaque
stringData:
  anthropic-api-key: "REPLACE_ME_OR_USE_EXTERNAL_SECRETS"
