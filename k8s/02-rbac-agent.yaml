# =============================================================================
# Sub-agent identity — deliberately powerless.
# A sub-agent should never need to talk to the Kubernetes API. It runs one task
# and dies. So: no Role, no RoleBinding, and the token is NOT mounted. Even if a
# sub-agent is fully jailbroken, it holds no Kubernetes credential to abuse.
# This is the OWASP LLM06 (excessive agency) mitigation at the identity layer.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nanoclaw-agent
  namespace: nanoclaw
automountServiceAccountToken: false
# No Role. No RoleBinding. Intentional. A sub-agent with API access is a design bug.
