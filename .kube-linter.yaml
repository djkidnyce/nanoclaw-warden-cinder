# Run against rendered overlays: kustomize build deploy/overlays/cilium | kube-linter lint -
checks:
  addAllBuiltIn: true
  exclude:
    # KEDA owns replica counts, so a single replica Redis and zero to N workloads are intended.
    - minimum-three-replicas
    - no-anti-affinity
    # Redis is a single instance coordination bus; see docs/HOW_IT_WORKS.md for the HA option.
    - no-rolling-update-strategy
    # Secrets are mounted as files on purpose. These checks flag env style usage we do not have.
    - read-secret-from-env-var
    # Probes on the controller are exec based and agents are run to completion Jobs.
    - no-readiness-probe
    - no-liveness-probe
    # Rules for features this project does not use.
    - dnsconfig-options
    - required-annotation-email
    - required-label-owner
    - use-namespace
    - pdb-min-available
    - pdb-max-unavailable
    - pdb-unhealthy-pod-eviction-policy
    - priority-class-name
    - restart-policy
    - job-ttl-seconds-after-finished
    - sorted-keys
    # Agent pods come from the KEDA ScaledJob custom resource, which kube-linter cannot read,
    # so it reports the agent policies as dangling. tests/policy/test_network_reachability.py
    # proves those policies select the agent pods.
    - dangling-networkpolicy
    - dangling-networkpolicypeer-podselector
    # Node placement is environment specific. Add affinity in your own overlay.
    - no-node-affinity
