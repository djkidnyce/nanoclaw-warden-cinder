<svg xmlns="http://www.w3.org/2000/svg" width="680" height="760" viewBox="0 0 680 760" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title>NanoClaw Warden Cinder deployment overview</title>
<desc>A controller deployment reads a Redis task queue and spawns ephemeral sub-agent Jobs via KEDA scale-to-zero. Each sub-agent runs in its own Pod with a powerless service account, a credential vault sidecar, default-deny networking, and restricted pod security. A legend lists pinned dependency versions.</desc>
<style>
  .t{font-size:14px;fill:#2C2C2A}
  .ts{font-size:12px;fill:#5F5E5A}
  .th{font-size:14px;font-weight:500;fill:#2C2C2A}
  .arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="680" height="760" fill="#ffffff"/>

<text class="th" x="40" y="30" font-size="18">NanoClaw Warden Cinder</text>
<text class="ts" x="40" y="48">Scalable isolated agents. Controller spawns ephemeral sub-agent Pods, scale to zero when idle.</text>

<rect x="40" y="66" width="160" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="120" y="86" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Inbound task</text>
<text class="ts" x="120" y="104" text-anchor="middle" dominant-baseline="central" fill="#444441">Redis stream</text>
<line x1="200" y1="92" x2="252" y2="92" class="arr" marker-end="url(#arrow)"/>

<rect x="254" y="62" width="180" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="344" y="82" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Controller</text>
<text class="ts" x="344" y="100" text-anchor="middle" dominant-baseline="central" fill="#185FA5">Decides, never acts</text>
<text class="ts" x="344" y="114" text-anchor="middle" dominant-baseline="central" fill="#185FA5">scales 0 to 1</text>

<text class="ts" x="500" y="84" text-anchor="middle">KEDA</text>
<text class="ts" x="500" y="100" text-anchor="middle">creates Jobs</text>
<line x1="434" y1="92" x2="556" y2="92" class="arr" marker-end="url(#arrow)"/>
<line x1="560" y1="100" x2="560" y2="150" class="arr" marker-end="url(#arrow)"/>

<rect x="40" y="150" width="600" height="300" rx="20" fill="none" stroke="#185FA5" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="th" x="60" y="176">Namespace: nanoclaw</text>
<text class="ts" x="60" y="194">Restricted Pod Security Standard enforced. Default-deny NetworkPolicy.</text>

<rect x="64" y="210" width="252" height="220" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="190" y="232" text-anchor="middle" fill="#085041">Sub-agent Pod (Job)</text>
<text class="ts" x="190" y="250" text-anchor="middle" fill="#0F6E56">Ephemeral, one task then exit</text>
<rect x="84" y="266" width="100" height="56" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="134" y="288" text-anchor="middle" dominant-baseline="central" fill="#04342C">agent</text>
<text class="ts" x="134" y="306" text-anchor="middle" dominant-baseline="central" fill="#085041">no API token</text>
<rect x="196" y="266" width="100" height="56" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="246" y="288" text-anchor="middle" dominant-baseline="central" fill="#412402">vault</text>
<text class="ts" x="246" y="306" text-anchor="middle" dominant-baseline="central" fill="#633806">holds keys</text>
<line x1="184" y1="294" x2="194" y2="294" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="190" y="348" text-anchor="middle">Powerless ServiceAccount</text>
<text class="ts" x="190" y="366" text-anchor="middle">Credentials injected at call time</text>
<text class="ts" x="190" y="384" text-anchor="middle">Egress only via vault</text>
<text class="ts" x="190" y="402" text-anchor="middle">No peer network path</text>

<rect x="364" y="210" width="252" height="220" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="490" y="232" text-anchor="middle" fill="#085041">Sub-agent Pod (Job)</text>
<text class="ts" x="490" y="250" text-anchor="middle" fill="#0F6E56">Scales 0 to N, then back to 0</text>
<rect x="384" y="266" width="100" height="56" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="434" y="288" text-anchor="middle" dominant-baseline="central" fill="#04342C">agent</text>
<text class="ts" x="434" y="306" text-anchor="middle" dominant-baseline="central" fill="#085041">no API token</text>
<rect x="496" y="266" width="100" height="56" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="546" y="288" text-anchor="middle" dominant-baseline="central" fill="#412402">vault</text>
<text class="ts" x="546" y="306" text-anchor="middle" dominant-baseline="central" fill="#633806">holds keys</text>
<line x1="484" y1="294" x2="494" y2="294" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="490" y="348" text-anchor="middle">Same isolation per Pod</text>
<text class="ts" x="490" y="366" text-anchor="middle">No shared mounts</text>
<text class="ts" x="490" y="384" text-anchor="middle">No surviving state</text>
<text class="ts" x="490" y="402" text-anchor="middle">Controller is sole router</text>

<text class="th" x="40" y="486">Trust boundary</text>
<rect x="40" y="500" width="600" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="56" y="522" dominant-baseline="central">Controller: only identity that can create Jobs, cannot read secrets or run tools.</text>
<text class="ts" x="56" y="536" dominant-baseline="central">High-impact actions (send, delete, transfer, modify ACL) returned as proposed for human approval.</text>

<text class="th" x="40" y="580">Dependencies, pinned and current as of 2026-06-22</text>
<rect x="40" y="594" width="190" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="56" y="614" dominant-baseline="central">KEDA</text>
<text class="ts" x="56" y="630" dominant-baseline="central">chart 2.20.1, app 2.19.0</text>
<rect x="245" y="594" width="190" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="261" y="614" dominant-baseline="central">Cilium</text>
<text class="ts" x="261" y="630" dominant-baseline="central">1.19.5, enforces netpol</text>
<rect x="450" y="594" width="190" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="466" y="614" dominant-baseline="central">Calico</text>
<text class="ts" x="466" y="630" dominant-baseline="central">3.32.0, alt CNI</text>

<text class="th" x="40" y="672">Legend</text>
<rect x="40" y="684" width="16" height="16" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="ts" x="64" y="692" dominant-baseline="central">Control plane (decides)</text>
<rect x="240" y="684" width="16" height="16" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="ts" x="264" y="692" dominant-baseline="central">Sub-agent (acts, isolated)</text>
<rect x="450" y="684" width="16" height="16" rx="4" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<text class="ts" x="474" y="692" dominant-baseline="central">Credential boundary</text>
<rect x="40" y="712" width="16" height="16" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="ts" x="64" y="720" dominant-baseline="central">Infrastructure / dependency</text>
</svg>
