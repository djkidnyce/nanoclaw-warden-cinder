<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NanoClaw Warden Cinder overview</title>
<style>
  :root { --bg: #faf9f5; --fg: #2c2c2a; --muted: #5f5e5a; --card: #ffffff; --line: rgba(0,0,0,0.12); }
  @media (prefers-color-scheme: dark) { :root { --bg: #1a1a18; --fg: #e8e6dd; --muted: #b0aea4; --card: #262624; --line: rgba(255,255,255,0.12); } }
  body { margin: 0; padding: 2rem 1rem; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 .5rem; }
  p { color: var(--muted); font-size: 14px; line-height: 1.6; }
  figure { margin: 1rem 0 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 1rem; }
  img { width: 100%; height: auto; display: block; border-radius: 6px; }
</style>
</head>
<body>
<main>
  <h1>NanoClaw Warden Cinder</h1>
  <p>Tasks land on Redis. KEDA reads stream lag and scales the controller, the agent Jobs and the vault from zero. Agents reach only Redis and the vault, and only the vault reaches the model API. Everything but Redis goes back to zero when the work is done.</p>
  <figure><img src="infographic.svg" alt="NanoClaw Warden Cinder deployment overview"></figure>
</main>
</body>
</html>
