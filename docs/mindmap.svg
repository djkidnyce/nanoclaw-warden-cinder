<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="928" viewBox="0 0 1500 928" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>How NanoClaw Warden Cinder works</title>
<desc>Mind map. Center: NanoClaw Warden Cinder. Branches: how a task flows, scale to zero, proof, security, recovery and stack.</desc>
<rect width="1500" height="928" fill="#FFFFFF"/>
<text x="40" y="44" font-size="22" font-weight="600" fill="#1F1E1C">How it works</text>
<text x="40" y="68" font-size="13" fill="#5F5E5A">Agents spark when there is work and burn out clean. Everything but Redis scales to zero.</text>
<path d="M794.0 391.7 C837.0 391.7 837.0 225.0 880.0 225.0" stroke="#0F6E56" stroke-width="3" fill="none" opacity="0.85"/>
<path d="M1030.0 225.0 C1070.0 225.0 1060 111.0 1100 111.0" stroke="#0F6E56" stroke-width="1.4" fill="none" opacity="0.6"/>
<rect x="1100" y="96.0" width="360" height="30" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="1114" y="115.5" font-size="13" fill="#2C2C2A">1  A task lands on the Redis tasks stream</text>
<path d="M1030.0 225.0 C1070.0 225.0 1060 149.0 1100 149.0" stroke="#0F6E56" stroke-width="1.4" fill="none" opacity="0.6"/>
<rect x="1100" y="134.0" width="360" height="30" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="1114" y="153.5" font-size="13" fill="#2C2C2A">2  Controller wakes and splits it into subtasks</text>
<path d="M1030.0 225.0 C1070.0 225.0 1060 187.0 1100 187.0" stroke="#0F6E56" stroke-width="1.4" fill="none" opacity="0.6"/>
<rect x="1100" y="172.0" width="360" height="30" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="1114" y="191.5" font-size="13" fill="#2C2C2A">3  KEDA sees the backlog as stream lag</text>
<path d="M1030.0 225.0 C1070.0 225.0 1060 225.0 1100 225.0" stroke="#0F6E56" stroke-width="1.4" fill="none" opacity="0.6"/>
<rect x="1100" y="210.0" width="360" height="30" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="1114" y="229.5" font-size="13" fill="#2C2C2A">4  One agent Job starts per waiting subtask</text>
<path d="M1030.0 225.0 C1070.0 225.0 1060 263.0 1100 263.0" stroke="#0F6E56" stroke-width="1.4" fill="none" opacity="0.6"/>
<rect x="1100" y="248.0" width="360" height="30" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="1114" y="267.5" font-size="13" fill="#2C2C2A">5  Agent calls the model through the vault</text>
<path d="M1030.0 225.0 C1070.0 225.0 1060 301.0 1100 301.0" stroke="#0F6E56" stroke-width="1.4" fill="none" opacity="0.6"/>
<rect x="1100" y="286.0" width="360" height="30" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="1114" y="305.5" font-size="13" fill="#2C2C2A">6  Result comes back, actions wait for a human</text>
<path d="M1030.0 225.0 C1070.0 225.0 1060 339.0 1100 339.0" stroke="#0F6E56" stroke-width="1.4" fill="none" opacity="0.6"/>
<rect x="1100" y="324.0" width="360" height="30" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="1114" y="343.5" font-size="13" fill="#2C2C2A">7  Everything drains back to zero</text>
<rect x="880.0" y="206.0" width="150" height="38" rx="19" fill="#0F6E56"/>
<text x="955.0" y="230.0" font-size="14.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">How a task flows</text>
<path d="M844.8 492.3 C862.4 492.3 862.4 498.0 880.0 498.0" stroke="#854F0B" stroke-width="3" fill="none" opacity="0.85"/>
<path d="M1030.0 498.0 C1070.0 498.0 1060 403.0 1100 403.0" stroke="#854F0B" stroke-width="1.4" fill="none" opacity="0.6"/>
<rect x="1100" y="388.0" width="360" height="30" rx="8" fill="#FDF0DC" stroke="#854F0B" stroke-width="0.8"/>
<text x="1114" y="407.5" font-size="13" fill="#2C2C2A">Redis is the only pod always on</text>
<path d="M1030.0 498.0 C1070.0 498.0 1060 441.0 1100 441.0" stroke="#854F0B" stroke-width="1.4" fill="none" opacity="0.6"/>
<rect x="1100" y="426.0" width="360" height="30" rx="8" fill="#FDF0DC" stroke="#854F0B" stroke-width="0.8"/>
<text x="1114" y="445.5" font-size="13" fill="#2C2C2A">Controller 0 to 1, cooldown 120 s</text>
<path d="M1030.0 498.0 C1070.0 498.0 1060 479.0 1100 479.0" stroke="#854F0B" stroke-width="1.4" fill="none" opacity="0.6"/>
<rect x="1100" y="464.0" width="360" height="30" rx="8" fill="#FDF0DC" stroke="#854F0B" stroke-width="0.8"/>
<text x="1114" y="483.5" font-size="13" fill="#2C2C2A">Agents 0 to 20, one Job per subtask</text>
<path d="M1030.0 498.0 C1070.0 498.0 1060 517.0 1100 517.0" stroke="#854F0B" stroke-width="1.4" fill="none" opacity="0.6"/>
<rect x="1100" y="502.0" width="360" height="30" rx="8" fill="#FDF0DC" stroke="#854F0B" stroke-width="0.8"/>
<text x="1114" y="521.5" font-size="13" fill="#2C2C2A">Vault 0 to 3, one per 8 agents, cooldown 60 s</text>
<path d="M1030.0 498.0 C1070.0 498.0 1060 555.0 1100 555.0" stroke="#854F0B" stroke-width="1.4" fill="none" opacity="0.6"/>
<rect x="1100" y="540.0" width="360" height="30" rx="8" fill="#FDF0DC" stroke="#854F0B" stroke-width="0.8"/>
<text x="1114" y="559.5" font-size="13" fill="#2C2C2A">KEDA lagCount with the accurate strategy</text>
<path d="M1030.0 498.0 C1070.0 498.0 1060 593.0 1100 593.0" stroke="#854F0B" stroke-width="1.4" fill="none" opacity="0.6"/>
<rect x="1100" y="578.0" width="360" height="30" rx="8" fill="#FDF0DC" stroke="#854F0B" stroke-width="0.8"/>
<text x="1114" y="597.5" font-size="13" fill="#2C2C2A">Recovery sweep window every 10 minutes</text>
<rect x="880.0" y="479.0" width="150" height="38" rx="19" fill="#854F0B"/>
<text x="955.0" y="503.0" font-size="14.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Scale to zero</text>
