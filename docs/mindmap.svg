<path d="M1030.0 733.0 C1070.0 733.0 1060 733.0 1100 733.0" stroke="#6B3FA0" stroke-width="1.4" fill="none" opacity="0.6"/>
<rect x="1100" y="718.0" width="360" height="30" rx="8" fill="#F0E8FA" stroke="#6B3FA0" stroke-width="0.8"/>
<text x="1114" y="737.5" font-size="13" fill="#2C2C2A">Scale emulation with real agent processes</text>
<path d="M1030.0 733.0 C1070.0 733.0 1060 771.0 1100 771.0" stroke="#6B3FA0" stroke-width="1.4" fill="none" opacity="0.6"/>
