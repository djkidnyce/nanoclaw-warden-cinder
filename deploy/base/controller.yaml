# The controller splits tasks and collects results. It has no Kubernetes API access
# and no model credentials. KEDA scales it between zero and one (see scaling.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  labels:
    app.kubernetes.io/component: controller
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: nanoclaw-controller
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Secret files mount as root:<fsGroup> 0440. Without this the app user can't read its password.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: nanoclaw-runtime
          args: ["controller"]
          envFrom:
            - configMapRef:
                name: nanoclaw-config
          env:
            - {name: REDIS_USERNAME, value: controller}
            - {name: REDIS_PASSWORD_FILE, value: /var/run/nanoclaw/redis/password}
            - {name: HEARTBEAT_FILE, value: /tmp/heartbeat}
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
          readinessProbe:
            exec:
              command: ["python", "-m", "nanoclaw.healthcheck", "/tmp/heartbeat", "15"]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["python", "-m", "nanoclaw.healthcheck", "/tmp/heartbeat", "60"]
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: redis-password, mountPath: /var/run/nanoclaw/redis, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: redis-password
          secret:
            secretName: nanoclaw-redis-controller
            defaultMode: 0440
            items: [{key: password, path: password}]
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
