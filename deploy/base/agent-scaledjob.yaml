# One Job per unit of unclaimed work on nanoclaw:subtasks. Zero work, zero pods.
# lagCount is the only Redis Streams mode KEDA can scale to zero with, and it needs Redis 7 or later.
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: nanoclaw-agent
  labels:
    app.kubernetes.io/component: agent
spec:
  pollingInterval: 5
  minReplicaCount: 0
  maxReplicaCount: 20
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 10
  rollout:
    strategy: gradual
  # lag already excludes claimed work, so "accurate" (queue minus pending Jobs, capped by
  # max minus running) is the matching strategy. "default" would subtract running Jobs twice.
  scalingStrategy:
    strategy: accurate
  jobTargetRef:
    parallelism: 1
    completions: 1
    # Retried pods keep the Job name, so they resume the message their predecessor claimed.
    backoffLimit: 3
    activeDeadlineSeconds: 900
    ttlSecondsAfterFinished: 600
    podFailurePolicy:
      rules:
        # Exit 64 means bad configuration. Retrying would not help.
        - action: FailJob
          onExitCodes:
            containerName: agent
            operator: In
            values: [64]
    template:
      metadata:
        labels:
          app.kubernetes.io/name: nanoclaw-warden-cinder
          app.kubernetes.io/component: agent
      spec:
        serviceAccountName: nanoclaw-agent
        automountServiceAccountToken: false
        enableServiceLinks: false
        restartPolicy: Never
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          # Secret files mount as root:<fsGroup> 0440. Without this the app user can't read its password.
          fsGroup: 65532
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: agent
            image: nanoclaw-runtime
            args: ["agent"]
            envFrom:
              - configMapRef:
                  name: nanoclaw-config
            env:
              - {name: REDIS_USERNAME, value: agent}
              - {name: REDIS_PASSWORD_FILE, value: /var/run/nanoclaw/redis/password}
              - {name: VAULT_URL, value: "http://vault:8200"}
              - name: CONSUMER_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['batch.kubernetes.io/job-name']
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests: {cpu: 100m, memory: 128Mi}
              limits: {cpu: "1", memory: 512Mi}
            volumeMounts:
              - {name: redis-password, mountPath: /var/run/nanoclaw/redis, readOnly: true}
              - {name: tmp, mountPath: /tmp}
        volumes:
          - name: redis-password
            secret:
              secretName: nanoclaw-redis-agent
              defaultMode: 0440
              items: [{key: password, path: password}]
          - name: tmp
            emptyDir:
              sizeLimit: 64Mi
  triggers:
    - type: redis-streams
      authenticationRef:
        name: nanoclaw-redis-keda
      metadata:
        address: redis.nanoclaw.svc.cluster.local:6379
        stream: "nanoclaw:subtasks"
        consumerGroup: agents
        lagCount: "1"
        activationLagCount: "0"
