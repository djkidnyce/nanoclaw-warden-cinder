# The vault is the only workload that holds the upstream API key and the only one
# with an egress path out of the cluster (granted by the CNI overlay). KEDA scales
# it from zero when the first agent pod appears and back to zero when they are gone.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  labels:
    app.kubernetes.io/component: vault
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: vault
  template:
    metadata:
      labels:
        app.kubernetes.io/component: vault
    spec:
      serviceAccountName: nanoclaw-vault
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Secret files mount as root:<fsGroup> 0440. Without this the app user can't read its password.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vault
          image: nanoclaw-runtime
          args: ["vault"]
          ports:
            - {name: http, containerPort: 8200}
          envFrom:
            - configMapRef:
                name: nanoclaw-config
          env:
            - {name: REDIS_USERNAME, value: vault}
            - {name: REDIS_PASSWORD_FILE, value: /var/run/nanoclaw/redis/password}
            - {name: UPSTREAM_API_KEY_FILE, value: /var/run/nanoclaw/upstream/api-key}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: redis-password, mountPath: /var/run/nanoclaw/redis, readOnly: true}
            - {name: upstream-key, mountPath: /var/run/nanoclaw/upstream, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: redis-password
          secret:
            secretName: nanoclaw-redis-vault
            defaultMode: 0440
            items: [{key: password, path: password}]
        - name: upstream-key
          secret:
            secretName: nanoclaw-upstream
            defaultMode: 0440
            items: [{key: api-key, path: api-key}]
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  labels:
    app.kubernetes.io/component: vault
spec:
  selector:
    app.kubernetes.io/component: vault
  ports:
    - {name: http, port: 8200, targetPort: http}
