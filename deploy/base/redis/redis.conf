# Redis is the queue and the scale signal. It is the only component that never scales to zero.
port 6379
bind * -::*
protected-mode yes
aclfile /etc/redis/acl/users.acl
dir /data
appendonly yes
appendfsync everysec
save ""
# Queues must never be silently evicted.
maxmemory 400mb
maxmemory-policy noeviction
# A hijacked agent must not be able to fill memory with one huge write.
# Defaults in Redis 8.12 are 512mb per value and 1gb per client query buffer.
# Our largest legitimate entry (32k chars of input, 64k of result) is far below 1mb.
proto-max-bulk-len 1mb
client-query-buffer-limit 4mb
maxclients 256
timeout 300
enable-debug-command no
enable-module-command no
enable-protected-configs no
# Log ACL denials so attempted abuse shows up in audit.
acllog-max-len 512
