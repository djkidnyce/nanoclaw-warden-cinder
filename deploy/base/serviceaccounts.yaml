# One identity per workload. None of them has a Role or RoleBinding, and none
# mounts an API token. No nanoclaw workload can call the Kubernetes API at all.
# KEDA creates the agent Jobs with its own identity, gated by the admission policy.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nanoclaw-controller
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nanoclaw-agent
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nanoclaw-vault
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nanoclaw-redis
automountServiceAccountToken: false
