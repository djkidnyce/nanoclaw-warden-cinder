name: ci

# Every action is pinned to a full commit SHA. Renovate keeps the SHAs and the
# versions in versions.env current. No secrets are used, so fork PRs run everything.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests and scanners
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Python dependencies
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Redis server matching production
        run: |
          . ./versions.env
          id="$(docker create "redis:${REDIS_VERSION}")"
          mkdir -p .tools/bin
          docker cp "$id:/usr/local/bin/redis-server" .tools/bin/redis-server
          docker cp "$id:/usr/local/bin/redis-cli" .tools/bin/redis-cli
          docker rm "$id"
          echo "REDIS_SERVER=$PWD/.tools/bin/redis-server" >> "$GITHUB_ENV"
          .tools/bin/redis-server --version
      - name: Pinned toolchain
        run: |
          ./scripts/fetch-tools.sh
          grep -v '^export PATH=' .tools/env.sh | sed 's/^export //; s/"//g' >> "$GITHUB_ENV"
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
          echo "$PWD/.tools/envtest" >> "$GITHUB_PATH"
      - name: Full regression suite
        run: ./scripts/test-all.sh
      - name: Scale timeline
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-timeline
          path: .pytest_cache/e2e-timeline.json
          if-no-files-found: ignore

  image:
    name: build runtime image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: nanoclaw-runtime:ci
      - name: Image runs as non root and refuses unknown roles
        run: |
          [ "$(docker image inspect nanoclaw-runtime:ci -f '{{.Config.User}}')" = "65532:65532" ]
          rc=0; docker run --rm --read-only nanoclaw-runtime:ci nope || rc=$?
          [ "$rc" = 64 ]

  e2e-kind:
    name: end to end on kind (Cilium, KEDA, scale 0 to N to 0)
    needs: [test, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
      - name: kind
        run: |
          ./scripts/fetch-tools.sh
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
      - name: Run
        run: ./tests/e2e/kind_e2e.sh
