name: ci

# Validates the project on every push and PR. Three gates:
#   1. lint      — shell, Python, and YAML syntax; preflight/installer parse
#   2. manifests — kubectl client-side dry-run renders every manifest
#   3. security  — kube-linter enforces the workload-hardening rules the
#                  threat model depends on (non-root, read-only fs, no extra caps,
#                  no privilege escalation). A regression here fails the build.
#
# No cluster is required. Everything runs client-side / static, so PRs from forks
# work without secrets. Versions of pinned deps are checked against the project's
# documented pins so a silent drift is caught.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint (shell / python / yaml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax + shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck >/dev/null
          for f in scripts/*.sh; do
            bash -n "$f"
            shellcheck -S warning "$f" || true   # advisory, do not fail the build on style
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax
        run: |
          python -m pip install --quiet pyyaml
          python -m py_compile orchestrator/controller.py agent/agent.py

      - name: YAML parses
        run: |
          python - <<'PY'
          import glob, yaml, sys
          bad = 0
          for f in glob.glob("k8s/*.yaml") + glob.glob(".github/workflows/*.yml"):
              try:
                  list(yaml.safe_load_all(open(f)))
                  print("ok  ", f)
              except Exception as e:
                  print("FAIL", f, e); bad += 1
          sys.exit(1 if bad else 0)
          PY

  manifests:
    name: manifests (kubectl dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Client-side dry-run of every manifest
        run: |
          fail=0
          for f in k8s/*.yaml; do
            echo "::group::$f"
            # client dry-run validates structure/required fields without a cluster.
            # KEDA ScaledJob is a CRD, so skip schema validation for it (no CRD present
            # in CI) but still confirm it parses as valid YAML object(s).
            if grep -q 'kind: ScaledJob' "$f"; then
              kubectl apply --dry-run=client --validate=false -f "$f"
            else
              kubectl apply --dry-run=client -f "$f"
            fi
            echo "::endgroup::"
          done
          exit $fail

  security:
    name: security (kube-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: kube-linter scan
        uses: stackrox/kube-linter-action@v1
        with:
          directory: k8s
          config: .kube-linter.yaml

  pins:
    name: dependency pins (drift check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm documented pins are present
        run: |
          # Fails if someone edits a pin in one place but not the docs.
          # These are the versions verified current as of 2026-06-22.
          grep -q 'KEDA_CHART_VERSION="2.20.1"' scripts/preflight.sh
          grep -q 'CILIUM_VERSION="1.19.5"'      scripts/preflight.sh
          grep -q 'CALICO_VERSION="v3.32.0"'     scripts/preflight.sh
          grep -q 'chart 2.20.1' README.md
          echo "pins consistent across scripts and README"
